common:
  default_window: bag_record

parameters:
  source: /external/humble_ws/install/setup.bash
  unitree_ros2: /external/humble_ws/src/unitree_ros2/setup.sh

windows:
  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 run go2w_imu_publisher imu_publisher
    name: imu_publisher

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - bash /external/scripts/run_hesai_lidar_points.sh
    name: hesai_lidar_node

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch fast_livo2 go2w_sensors.launch.py use_hesai:=false use_go2w_imu:=false use_realsense:=true
    name: realsense

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - sleep 5
      - "ros2 bag record -o /external/bags/raw_$(date +%Y%m%d_%H%M%S) /go2w/imu /hesai_node/points_raw /camera/camera/color/image_raw /camera/camera/color/camera_info"
    name: bag_record
