common:
  default_window: bag_record

parameters:
  source: /external/humble_ws/install/setup.bash

windows:
  - commands:
      - source ${source}
      - bash /external/scripts/run_livox_mid360_points.sh
    name: livox_mid360

  - commands:
      - source ${source}
      - ros2 launch fast_livo2 go2w_sensors.launch.py use_livox:=false use_hesai:=false use_go2w_imu:=false use_realsense:=true
    name: realsense

  - commands:
      - source ${source}
      - sleep 5
      - "ros2 bag record -o /external/bags/raw_$(date +%Y%m%d_%H%M%S) /livox/lidar /livox/imu /camera/camera/color/image_raw /camera/camera/color/camera_info"
    name: bag_record
