common:
  default_window: rviz2

parameters:
  source: /external/humble_ws/install/setup.bash
  rviz_cfg: /external/config/fast_livo2/fast_livo2.rviz

windows:
  - commands:
      - source ${source}
      - bash /external/scripts/run_livox_mid360_points.sh
    name: livox_mid360

  - commands:
      - source ${source}
      - ros2 launch fast_livo2 go2w_sensors.launch.py use_livox:=false use_hesai:=false use_go2w_imu:=false use_realsense:=true
    name: realsense

  - commands:
      - source ${source}
      - ros2 launch fast_livo2 go2w_fast_livo2.launch.py use_sensor_bringup:=false params_file:=/external/humble_ws/src/fast-livo2/config/go2w_fast_livo2.yaml
    name: fast_livo2

  - commands:
      - source ${source}
      - sleep 3
      - "rviz2 -d ${rviz_cfg}"
    name: rviz2
