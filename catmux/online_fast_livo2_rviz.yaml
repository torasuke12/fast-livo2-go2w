common:
  default_window: rviz2

parameters:
  source: /external/humble_ws/install/setup.bash
  unitree_ros2: /external/humble_ws/src/unitree_ros2/setup.sh
  rviz_cfg: /external/config/fast_livo2/fast_livo2.rviz

windows:
  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 run go2w_imu_publisher imu_publisher
    name: imu_publisher

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - bash /external/scripts/run_hesai_lidar_points.sh
    name: hesai_lidar_node

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch fast_livo2 go2w_sensors.launch.py use_hesai:=false use_go2w_imu:=false use_realsense:=true
    name: realsense

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch fast_livo2 go2w_fast_livo2.launch.py use_sensor_bringup:=false
    name: fast_livo2

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - sleep 3
      - "rviz2 -d ${rviz_cfg}"
    name: rviz2
