common:
  default_window: rviz2

parameters:
  source: /external/humble_ws/install/setup.bash
  unitree_ros2: /external/humble_ws/src/unitree_ros2/setup.sh
  rviz_cfg: /external/config/fast_livo2/fast_livo2.rviz
  # Set this to the processed FAST-LIVO2 bag directory, e.g.:
  #   bag: /external/bags/fast_livo2_20260301_143022
  bag: /external/bags/REPLACE_WITH_BAG_NAME

windows:
  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - "ros2 bag play ${bag} --clock"
    name: bag_play

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - sleep 2
      - "rviz2 -d ${rviz_cfg} --ros-args -p use_sim_time:=true"
    name: rviz2
