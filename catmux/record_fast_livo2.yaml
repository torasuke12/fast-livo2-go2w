common:
  default_window: bag_record

parameters:
  source: /external/humble_ws/install/setup.bash
  unitree_ros2: /external/humble_ws/src/unitree_ros2/setup.sh

windows:
  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 run go2w_imu_publisher imu_publisher
    name: imu_publisher

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch hesai_lidar hesai_lidar_launch.py
    name: hesai_lidar_node

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch fast_livo2 go2w_sensors.launch.py use_hesai:=false use_go2w_imu:=false use_realsense:=true
    name: realsense

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - ros2 launch fast_livo2 go2w_fast_livo2.launch.py use_sensor_bringup:=false
    name: fast_livo2

  - commands:
      - source ${source}
      - source ${unitree_ros2}
      - sleep 5
      - "ros2 bag record -o /external/bags/fast_livo2_$(date +%Y%m%d_%H%M%S) /aft_mapped_to_init /path /cloud_registered /Laser_map /rgb_img /LIVO2/imu_propagate /tf /tf_static"
    name: bag_record
