name: fast-livo2-go2w

services:
  fast-livo2-go2w-humble:
    image: fast-livo2-go2w:latest
    build:
      context: ..
      dockerfile: docker/robot/Dockerfile
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DISTRO: humble
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///external/humble_ws/src/unitree_ros2/cyclonedds_ws/src/cyclonedds.xml
      FAST_LIVO2_WS: /external/humble_ws
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.host.xauthority
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ..:/external:rw
      - ${LIVOX_ROS_DRIVER2_HOST:-../../livox_ros_driver2}:/fast_livo2/src/livox_ros_driver2:rw
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${FAST_LIVO2_XAUTHORITY:-/dev/null}:/tmp/.host.xauthority:ro
    working_dir: /external
    command: sleep infinity
